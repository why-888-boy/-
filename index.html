<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>专属告白 | 心动只为你</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "微软雅黑", sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
        }

        /* 粒子背景 */
        .particle-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 主容器 */
        .main-box {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 初始页面 */
        .page1 {
            text-align: center;
            color: #fff;
            animation: fadeShow 2s ease;
        }

        .page1 h2 {
            font-size: 42px;
            margin-bottom: 30px;
            text-shadow: 0 0 15px #ff7eb9;
        }

        .page1 p {
            font-size: 20px;
            color: #eee;
            margin-bottom: 50px;
            letter-spacing: 2px;
        }

        .start-btn {
            padding: 16px 45px;
            font-size: 18px;
            background: linear-gradient(135deg, #ff6a95, #ff4d88);
            color: #fff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 77, 136, 0.6);
            transition: all 0.3s ease;
        }

        .start-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 35px rgba(255, 77, 136, 0.8);
        }

        /* 第二页 选择页面 */
        .page2 {
            display: none;
            text-align: center;
            color: #fff;
            animation: fadeShow 1.5s ease;
        }

        .page2 h3 {
            font-size: 36px;
            margin-bottom: 40px;
            text-shadow: 0 0 12px #ff7eb9;
        }

        .btn-group {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .yes-btn, .no-btn {
            padding: 14px 40px;
            font-size: 17px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .yes-btn {
            background: #ff4d88;
            color: #fff;
        }

        .no-btn {
            background: #666;
            color: #fff;
        }

        /* 最终告白页面 */
        .page3 {
            display: none;
            text-align: center;
            color: #fff;
            padding: 20px;
            animation: fadeShow 2s ease;
        }

        .page3 .big-heart {
            font-size: 100px;
            animation: heartBeat 1s infinite alternate;
            margin-bottom: 30px;
            display: inline-block;
        }

        .page3 h2 {
            font-size: 40px;
            color: #ff7eb9;
            margin-bottom: 25px;
        }

        .page3 .words {
            font-size: 22px;
            line-height: 2.2;
            max-width: 700px;
            margin: 0 auto;
            color: #f8f8f8;
        }

        /* 花朵特效 */
        .flower {
            position: fixed;
            font-size: 24px;
            pointer-events: none;
            animation: flowerFall 5s linear forwards;
            z-index: 10;
        }

        /* 动画定义 */
        @keyframes fadeShow {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes heartBeat {
            from { transform: scale(1); }
            to { transform: scale(1.2); }
        }

        @keyframes flowerFall {
            0% {
                transform: translateY(-10%) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* 移动端适配 */
        @media (max-width: 600px) {
            .page1 h2, .page3 h2 {
                font-size: 28px;
            }
            .page2 h3 {
                font-size: 24px;
            }
            .page3 .words {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="particle-bg" id="particles"></div>

    <div class="main-box">
        <!-- 第一页 开场 -->
        <div class="page1" id="page1">
            <h2>远哥有一段悄悄话，想让你看</h2>
            <p>准备好了吗？小琦琦</p>
            <button class="start-btn" onclick="goPage(2)">开启告白</button>
        </div>

        <!-- 第二页 选择页 -->
        <div class="page2" id="page2">
            <h3>我喜欢你，你愿意喜欢我吗？</h3>
            <div class="btn-group">
                <button class="yes-btn" onclick="goPage(3)">我愿意</button>
                <button class="no-btn" id="noBtn">再考虑一下</button>
            </div>
        </div>

        <!-- 第三页 最终告白 -->
        <div class="page3" id="page3">
            <div class="big-heart">❤️</div>
            <h2>何其有幸，遇见你</h2>
            <div class="words">
                人海茫茫，偏偏对你动了心<br>
                不想做路人，只想做你的心上人<br>
                往后朝夕，风雨同行<br>
                满心欢喜，皆归于你<br>
                我爱你，不止今朝，而是朝朝暮暮
            </div>
        </div>
    </div>

    <script>
        // 页面切换
        function goPage(num) {
            document.getElementById('page1').style.display = 'none';
            document.getElementById('page2').style.display = 'none';
            document.getElementById('page3').style.display = 'none';

            if(num === 2) {
                document.getElementById('page2').style.display = 'block';
            } else if(num === 3) {
                document.getElementById('page3').style.display = 'block';
                // 开启满屏花朵
                setInterval(createFlower, 200);
            }
        }

        // "拒绝"按钮躲避效果
        const noBtn = document.getElementById('noBtn');
        noBtn.addEventListener('mouseover', function() {
            const w = window.innerWidth - 120;
            const h = window.innerHeight - 60;
            let x = Math.random() * w;
            let y = Math.random() * h;
            noBtn.style.position = 'absolute';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        });

        // 飘落花朵
        function createFlower() {
            const flowerArr = ['🌸', '💐', '🌹', '🌷'];
            let flower = document.createElement('div');
            flower.className = 'flower';
            flower.innerHTML = flowerArr[Math.floor(Math.random() * flowerArr.length)];
            flower.style.left = Math.random() * 100 + 'vw';
            flower.style.fontSize = Math.random() * 20 + 16 + 'px';
            flower.style.animationDuration = Math.random() * 3 + 4 + 's';
            document.body.appendChild(flower);

            setTimeout(() => {
                flower.remove();
            }, 7000);
        }

        // 背景光点粒子
        function createParticle() {
            let p = document.createElement('div');
            p.style.position = 'absolute';
            p.style.width = Math.random() * 4 + 2 + 'px';
            p.style.height = p.style.width;
            p.style.background = '#ff99bb';
            p.style.borderRadius = '50%';
            p.style.left = Math.random() * 100 + '%';
            p.style.top = Math.random() * 100 + '%';
            p.style.opacity = Math.random() * 0.6 + 0.2;
            p.style.boxShadow = '0 0 6px #ff7eb9';
            document.getElementById('particles').appendChild(p);
        }

        // 生成背景粒子
        for(let i = 0; i < 80; i++) {
            createParticle();
        }
    </script>
</body>
</html>
