<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💖 专属告白 · 樱花之恋 💖</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "微软雅黑", sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(to bottom, #ffeff6, #ffe6f2, #ffd1e7);
            background-attachment: fixed;
        }

        /* 樱花花瓣 */
        .sakura {
            position: fixed;
            background: #ffc0d5;
            border-radius: 50% 0 50% 50%;
            pointer-events: none;
            animation: sakuraFall linear infinite;
            z-index: 0;
            opacity: 0.8;
            transform: rotate(45deg);
        }

        @keyframes sakuraFall {
            0% {
                transform: rotate(45deg) translateY(-10vh);
            }
            100% {
                transform: rotate(225deg) translateY(110vh);
                opacity: 0;
            }
        }

        /* 页面容器 */
        .main-box {
            position: relative;
            width: 100%;
            height: 100vh;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* 渐入动画 */
        @keyframes fadeShow {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 第一页 */
        .page1 {
            text-align: center;
            color: #ff5a8c;
            animation: fadeShow 2s ease;
        }

        .page1 h2 {
            font-size: 42px;
            margin-bottom: 30px;
        }

        .page1 p {
            font-size: 20px;
            color: #ff7ba5;
            margin-bottom: 50px;
        }

        .start-btn {
            padding: 16px 45px;
            font-size: 18px;
            background: #ff5a8c;
            color: #fff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px #ff5a8c55;
            transition: 0.3s;
        }

        .start-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px #ff5a8c77;
        }

        /* 第二页 */
        .page2 {
            display: none;
            text-align: center;
            color: #ff5a8c;
            animation: fadeShow 1.5s ease;
        }

        .page2 h3 {
            font-size: 36px;
            margin-bottom: 40px;
        }

        .btn-group {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .yes-btn, .no-btn {
            padding: 14px 40px;
            font-size: 17px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .yes-btn {
            background: #ff5a8c;
            color: #fff;
        }

        .no-btn {
            background: #cccccc;
            color: #666;
        }

        /* 游戏页 */
        .game-page {
            display: none;
            width: 100%;
            color: #ff5a8c;
            text-align: center;
            animation: fadeShow 1.5s ease;
        }

        .game-title {
            font-size: 32px;
            margin: 10px 0;
        }

        .game-tip {
            font-size: 18px;
            color: #ff7ba5;
            margin-bottom: 15px;
        }

        .score-box {
            font-size: 22px;
            margin-bottom: 20px;
        }

        /* 卡牌 */
        .card-wrap {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            max-width: 440px;
            margin: 0 auto;
        }

        .card {
            width: 95px;
            height: 95px;
            position: relative;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.5s;
        }

        .card.flip {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            backface-visibility: hidden;
        }

        .card-front {
            background: #ff8fb8;
            color: #fff;
        }

        .card-back {
            background: #fff;
            color: #ff5a8c;
            transform: rotateY(180deg);
        }

        /* 告白页 */
        .page3 {
            display: none;
            text-align: center;
            color: #ff5a8c;
            animation: fadeShow 2s ease;
        }

        .big-heart {
            font-size: 100px;
            animation: beat 1s infinite alternate;
            margin-bottom: 20px;
        }

        @keyframes beat {
            from { transform: scale(1); }
            to { transform: scale(1.15); }
        }

        .page3 h2 {
            font-size: 40px;
            margin-bottom: 25px;
        }

        .words {
            font-size: 22px;
            line-height: 2.2;
            color: #ff5a8c;
        }

        /* 手机适配 */
        @media (max-width: 600px) {
            .page1 h2, .page3 h2 { font-size: 28px; }
            .page2 h3, .game-title { font-size: 24px; }
            .card { width: 70px; height: 70px; }
            .card-front, .card-back { font-size: 26px; }
        }
    </style>
</head>

<body>
    <div class="main-box">
        <div class="page1" id="page1">
            <h2>有一段话，想讲给你听</h2>
            <p>准备好了吗？</p>
            <button class="start-btn" onclick="goPage(2)">开启告白</button>
        </div>

        <div class="page2" id="page2">
            <h3>我喜欢你，你愿意做我的偏爱吗？</h3>
            <div class="btn-group">
                <button class="yes-btn" onclick="goPage(4)">接受挑战</button>
                <button class="no-btn" id="noBtn">再考虑一下</button>
            </div>
        </div>

        <div class="game-page" id="gamePage">
            <h2 class="game-title">💖 爱心配对大挑战 💖</h2>
            <p class="game-tip">找出全部相同爱心即可解锁告白</p>
            <div class="score-box">已配对：<span id="matchNum">0</span> / 6</div>
            <div class="card-wrap" id="cardBox"></div>
        </div>

        <div class="page3" id="page3">
            <div class="big-heart">❤️</div>
            <h2>何其有幸，遇见你</h2>
            <div class="words">
                人海茫茫，偏偏对你动了心<br>
                不想做路人，只想做你的心上人<br>
                往后朝夕，风雨同行<br>
                满心欢喜，皆归于你<br>
                我爱你，不止今朝，而是朝朝暮暮
            </div>
        </div>
    </div>

    <script>
        // 页面切换
        let cardData = [], openCards = [], lock = false, matchCount = 0, totalPair = 6;

        function goPage(num) {
            document.querySelectorAll('.page1,.page2,.game-page,.page3').forEach(el => el.style.display = 'none');
            if (num === 2) document.getElementById('page2').style.display = 'block';
            if (num === 4) { matchCount = 0; document.getElementById('matchNum').innerText = 0; document.getElementById('gamePage').style.display = 'block'; initGame(); }
            if (num === 3) document.getElementById('page3').style.display = 'block';
        }

        // 逃跑按钮
        const noBtn = document.getElementById('noBtn');
        noBtn.addEventListener('mouseover', () => {
            noBtn.style.left = Math.random() * (window.innerWidth - 120) + 'px';
            noBtn.style.top = Math.random() * (window.innerHeight - 60) + 'px';
            noBtn.style.position = 'absolute';
        });

        // 樱花飘落（全程）
        function createSakura() {
            const s = document.createElement('div');
            s.className = 'sakura';
            let size = Math.random() * 12 + 8;
            s.style.width = size + 'px';
            s.style.height = size + 'px';
            s.style.left = Math.random() * 100 + 'vw';
            s.style.animationDuration = Math.random() * 4 + 4 + 's';
            document.body.appendChild(s);
            setTimeout(() => s.remove(), 9000);
        }
        setInterval(createSakura, 120);

        // 游戏初始化
        function initGame() {
            const icons = ['❤️', '💖', '💓', '💕', '💗', '💞'];
            cardData = [...icons, ...icons].sort(() => Math.random() - 0.5);
            const box = document.getElementById('cardBox');
            box.innerHTML = '';
            openCards = []; lock = false;

            cardData.forEach((icon, i) => {
                let c = document.createElement('div');
                c.className = 'card';
                c.dataset.icon = icon;
                c.innerHTML = `<div class="card-front">?</div><div class="card-back">${icon}</div>`;
                c.onclick = flip;
                box.appendChild(c);
            });
        }

        function flip() {
            if (lock || this.classList.contains('flip')) return;
            this.classList.add('flip');
            openCards.push(this);

            if (openCards.length === 2) {
                lock = true;
                let a = openCards[0], b = openCards[1];
                if (a.dataset.icon === b.dataset.icon) {
                    matchCount++;
                    document.getElementById('matchNum').innerText = matchCount;
                    a.style.pointerEvents = 'none';
                    b.style.pointerEvents = 'none';
                    openCards = []; lock = false;
                    if (matchCount >= totalPair) setTimeout(() => goPage(3), 700);
                } else {
                    setTimeout(() => {
                        a.classList.remove('flip');
                        b.classList.remove('flip');
                        openCards = []; lock = false;
                    }, 700);
                }
            }
        }
    </script>
</body>
</html>
